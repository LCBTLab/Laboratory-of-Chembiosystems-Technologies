services:
  # Backend API
  - type: web
    name: chembiolab-backend
    env: python
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python server.py"
    envVars:
      - key: MONGO_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.netlify.app
    autoDeploy: true

  # MongoDB Database
  - type: pserv
    name: chembiolab-mongodb
    env: docker
    dockerCommand: mongod --bind_ip_all
    dockerfilePath: ./Dockerfile
    disk:
      name: mongodb-data
      mountPath: /data/db
      sizeGB: 1

  # Frontend Static Site
  - type: web
    name: chembiolab-frontend
    env: static
    buildCommand: "cd frontend && yarn install && yarn build"
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_REACT_APP_BACKEND_URL
        value: https://chembiolab-backend.onrender.com
